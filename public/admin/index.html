<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sveltia CMS – Astro Blog Manager</title>
    <!-- Sveltia CMS: Modern, Git-based client-side CMS (Decap/Netlify CMS replacement) -->
    <!-- Connects directly to your GitHub repository and commits markdown & media -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --sveltia-cms-font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      }
      body {
        margin: 0;
        background-color: #000000;
        color: #f1f5f9;
        font-family: var(--sveltia-cms-font-family);
      }
    </style>
    <!-- Sveltia CMS bundle -->
    <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js" type="module"></script>
