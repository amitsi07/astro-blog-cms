# Sveltia CMS Configuration for PromptPlum
# Designed to run 100% Free on Cloudflare Pages + GitHub

backend:
  name: github
  repo: amitsi07/astro-blog-cms # Replace with your GitHub user/repo
  branch: main
  auth_type: ""

media_folder: "public/uploads"
public_folder: "/uploads"

display_url: "/"
logo_url: "/logo.svg"

collections:
  - name: "posts"
    label: "Prompts & Articles"
    label_singular: "Post"
    folder: "src/content/posts"
    create: true
    slug: "{{slug}}"
    format: "json"
    fields:
      - { label: "ID", name: "id", widget: "string" }
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Slug", name: "slug", widget: "string" }
      - { label: "AI Model", name: "model", widget: "select", options: [
          "Midjourney v6",
          "Gemini / Imagen 3",
          "ChatGPT / DALL·E 3",
          "Flux.1",
          "Stable Diffusion XL"
        ] }
      - { label: "Category", name: "category", widget: "select", options: [
          "Portraits",
          "Cinematic",
          "Realistic",
          "Fashion",
          "Cyberpunk",
          "Fantasy",
          "Product",
          "3D Art",
          "Anime",
          "Architecture"
        ] }
      - { label: "Image URL or Upload", name: "image", widget: "image" }
      - { label: "Aspect Ratio", name: "aspectRatio", widget: "select", options: ["1:1", "16:9", "9:16", "4:3", "3:4", "4:5"] }
      - { label: "Prompt Text", name: "prompt", widget: "text" }
      - { label: "Negative Prompt", name: "negativePrompt", widget: "text", required: false }
      - { label: "Tags", name: "tags", widget: "list" }
      - { label: "Recommended Settings", name: "settings", widget: "object", fields: [
          { label: "Stylize / CFG", name: "stylize", widget: "string", required: false },
          { label: "Lighting", name: "lighting", widget: "string", required: false },
          { label: "Camera & Lens", name: "lens", widget: "string", required: false }
        ]}
      - { label: "Featured in Hero", name: "featured", widget: "boolean", default: false }
      - { label: "Author", name: "author", widget: "string", default: "PromptPlum Community" }

  - name: "categories"
    label: "Categories"
    folder: "content/categories"
    create: true
    slug: "{{slug}}"
    format: "json"
    fields:
      - { label: "Name", name: "name", widget: "string" }
      - { label: "Slug", name: "slug", widget: "string" }
      - { label: "Description", name: "description", widget: "string" }
      - { label: "Icon Name", name: "icon", widget: "string" }
